version: 2
updates:
  # Python dependencies. The "pip" ecosystem discovers pyproject.toml, uv.lock
  # and requirements.txt, so uv-managed dependencies are kept patched here.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the publish workflow (currently pinned to old majors).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
